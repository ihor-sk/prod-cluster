apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secret
  namespace: user-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: admin-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: prod/eweb/admin
        property: userManagementUser
    - secretKey: password
      remoteRef:
        key: prod/eweb/admin
        property: userManagementPassword