apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secret
  namespace: user-management
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: admin-secret
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        username: "{{ .userManagementUser }}"
        password: "{{ .userManagementPassword }}"
  data:
    - secretKey: userManagementPassword
      remoteRef:
        key: stage/eweb/admin
        property: userManagementPassword
    - secretKey: userManagementUser
      remoteRef:
        key: stage/eweb/admin
        property: userManagementUser
