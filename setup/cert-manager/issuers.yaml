apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: namecheap-letsencrypt-stage
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email:  test@librelab.online
    privateKeySecretRef:
      name: namecheap-letsencrypt-stage
    solvers:
      - dns01:
          webhook:
            groupName: acme.namecheap.com
            solverName: namecheap
            config:
              apiKeySecretRef:
                name: namecheap-credentials
                key: apiKey
              apiUserSecretRef:
                name: namecheap-credentials
                key: apiUser
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: route53-letsencrypt-stage
spec:
  acme:
    email: admin@ewebsystems.net
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: route53-letsencrypt-stage
    solvers:
      - selector:
          dnsZones:
            - "ewebsystems.net"
        dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z02977163LNV8CWDC2T99
            accessKeyID: "AKIA4BIQSU3H5V2CGYXY"
            secretAccessKeySecretRef:
              name: aws-credentials-secret
              key: secret-access-key
