apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Owner
    template:
      type: Opaque
      engineVersion: v2
      data:
        admin.password: "{{ .argoPassword }}"
        admin.passwordMtime: "2025-10-09T12:34:56Z"
        server.secretkey: "{{ .argoSecretKey }}"
  data:
    - secretKey: argoPassword
      remoteRef:
        key: stage/eweb/admin
        property: argoPassword
    - secretKey: argoSecretKey
      remoteRef:
        key: stage/eweb/admin
        property: argoSecretKey
