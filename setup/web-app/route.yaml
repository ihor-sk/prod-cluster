apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: nginx-hello-gateway
  namespace: default
spec:
  selector:
    istio: ingressgateway   # use Istio’s ingress gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "a7077c113ef1e499eaad4f442a0c7bc1-b8352132fa7ca273.elb.us-east-1.amazonaws.com"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: nginx-hello-vs
  namespace: default
spec:
  hosts:
    - "a7077c113ef1e499eaad4f442a0c7bc1-b8352132fa7ca273.elb.us-east-1.amazonaws.com"
  gateways:
    - nginx-hello-gateway
  http:
    - route:
        - destination:
            host: nginx-hello
            port:
              number: 80
