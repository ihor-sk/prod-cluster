apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-hello
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-hello
  template:
    metadata:
      labels:
        app: nginx-hello
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: nginx-hello-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-hello-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Hello from NGINX</title>
    </head>
    <body>
      <h1>Hello World from NGINX served through Istio 🚀</h1>
    </body>
    </html>
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-hello
  namespace: default
spec:
  selector:
    app: nginx-hello
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nginx-ewebsystems
  namespace: default
spec:
  hosts:
    - "test.ewebsystems.net"
  gateways:
    - istio-ingress/main-gateway
  http:
    - route:
        - destination:
            host: nginx-hello.default.svc.cluster.local
            port:
              number: 80