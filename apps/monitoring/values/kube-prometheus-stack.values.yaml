grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin
    userKey: user
    passwordKey: password
  persistence:
    enabled: true
    type: pvc
    size: 10Gi
  ingress:
    enabled: false
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://monitoring-kube-prometheus-stack-loki-gateway
      isDefault: false
      editable: true
      version: 1
      jsonData:
        maxLines: 1000
        httpHeaderName1: X-Scope-OrgID
      secureJsonData:
        httpHeaderValue1: self-monitoring
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 30Gi
alloy:
  enabled: true
  config: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "pods" {
      role = "pod"
    }

    loki.source.kubernetes "pods_labeled_namespaces" {
      targets = discovery.kubernetes.pods.targets

      relabel_rules = [
        {
          action        = "keep"
          source_labels = ["__meta_kubernetes_namespace_label_logs"]
          regex         = "true"
        },


        { action="replace", source_labels=["__meta_kubernetes_namespace"], target_label="namespace" },
        { action="replace", source_labels=["__meta_kubernetes_pod_name"], target_label="pod" },
        { action="replace", source_labels=["__meta_kubernetes_pod_container_name"], target_label="container" },

        { action="replace", source_labels=["__meta_kubernetes_pod_label_app"], target_label="app" },
      ]

      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://monitoring-kube-prometheus-stack-loki-gateway/loki/api/v1/push"
        headers = {
          "X-Scope-OrgID" = "self-monitoring",
        }
      }
    }
