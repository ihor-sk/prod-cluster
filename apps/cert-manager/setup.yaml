apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-app
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  source:
    repoURL: git@github.com:ihor-sk/prod-cluster.git
    targetRevision: main
    path: setup/cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true