apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eweb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: eweb
  source:
    repoURL: git@github.com:ihor-sk/prod-cluster.git
    targetRevision: main
    path: charts/tenant-app
    helm:
      valueFiles:
        - values/values.yaml
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true ]
