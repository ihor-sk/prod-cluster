apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-default-user-creds
  namespace: eweb
stringData:
  password: "qwerty"
  username: "eweb"
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: cluster
  namespace: eweb
spec:
  replicas: 1
  service:
    spec:
      type: ClusterIP
  override:
    statefulSet:
      spec:
        template:
          spec:
            containers:
              - name: rabbitmq
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "1"
                    memory: "1Gi"
                env:
                  - name: RABBITMQ_DEFAULT_USER
                    value: eweb
                  - name: RABBITMQ_DEFAULT_PASS_SECRET_NAME
                    value: rabbitmq-default-user-creds
                  - name: RABBITMQ_DEFAULT_PASS_SECRET_KEY
                    value: password