apiVersion: v1
kind: Secret
metadata:
  name: broker-eweb-user
  namespace: eweb
stringData:
  password: "qwerty"
  username: "eweb"
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: eweb-broker
  namespace: eweb
spec:
  replicas: 1
  service:
    spec:
      type: ClusterIP
  override:
    statefulSet:
      spec:
        template:
          spec:
            initContainers:
              - name: setup-container
                image: rabbitmq:4.1.3-management
                command:
                  - bash
                  - -lc
                  - |
                    set -euo pipefail
                    # Make sure dirs & cookie are owned by UID/GID 999 and cookie is owner-only
                    chown -R 999:999 /var/lib/rabbitmq || true
                    chown -R 999:999 /etc/rabbitmq || true
                    if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then
                    chmod 600 /var/lib/rabbitmq/.erlang.cookie || true
                    fi
                securityContext:
                  runAsNonRoot: false
                  runAsUser: 0
                  allowPrivilegeEscalation: false
            securityContext:
              fsGroup: 999
              fsGroupChangePolicy: OnRootMismatch
            containers:
              - name: rabbitmq
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 999
                  runAsGroup: 999
                  allowPrivilegeEscalation: false
                env:
                  - name: RABBITMQ_DEFAULT_USER
                    valueFrom:
                      secretKeyRef:
                        name: broker-eweb-user
                        key: username
                  - name: RABBITMQ_DEFAULT_PASS
                    valueFrom:
                      secretKeyRef:
                        name: broker-eweb-user
                        key: password
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "1"
                    memory: "1Gi"
              - name: netbird-agent
                image: netbirdio/netbird:latest
                imagePullPolicy: Always
                securityContext:
                  runAsNonRoot: false
                  runAsUser: 0
                  privileged: true
                  capabilities:
                    add: ["NET_ADMIN","SYS_RESOURCE","SYS_ADMIN"]
                env:
                  - name: NB_SETUP_KEY
                    value: "26CDFB5D-6083-4580-9524-D08BDF89F1C1"
                  - name: NB_HOSTNAME
                    value: "rabbitmq"
                  - name: NB_LOG_LEVEL
                    value: "debug"
                  - name: NB_MANAGEMENT_URL
                    value: "https://vpn.librelab.online"
                  - name: NB_LOG_FILE
                    value: "console"
                resources:
                  limits:
                    cpu: 100m
                    memory: 128Mi
                  requests:
                    cpu: 50m
                    memory: 64Mi