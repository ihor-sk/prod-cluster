{{- $ns := .Values.global.namespace | default "eweb" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: "realm-job"
  namespace: "eweb"
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: keycloak-config-cli
          image: "docker.io/adorsys/keycloak-config-cli:latest"
          imagePullPolicy: {{ default "IfNotPresent" .Values.imagePullPolicy }}
          securityContext:
            runAsUser: 0
          command: ["/bin/sh","-ec"]
          args:
            - |
              echo "=== Keycloak config: multi-tenant run ==="
              echo "=== Chek existing tenants ==="
              {{- range $i, $t := .Values.tenants }}
              echo "--- Processing tenant: {{ $t.name }} ---"
              TENANT="{{ $t.name }}" /scripts/run.sh 
              echo "--- Done tenant: {{ $t.name }} ---"
              {{- end }}
              echo "=== All tenants processed ==="
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true            
            - name: template
              mountPath: /config
              readOnly: true
              {{- range $i, $t := .Values.tenants }}
            - name: tenant-{{ $t.name }}
              mountPath: /tenants/{{ $t.name }}
              readOnly: true
              {{- end }}
          env:
            - name: KEYCLOAK_URL
              value: "https://user-management.ewebsystems.net"
            - name: KEYCLOAK_SSLVERIFY
              value: "false"
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:file:/tmp/secrets.properties"
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: user-management-secret
                  key: username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-management-secret
                  key: password
            - name: IMPORT_FILES_LOCATIONS
              value: "/config/template.json"
      volumes:
        - name: template
          configMap:
            name: "realm-template"
            items:
              - key: template.json
                path: template.json
        - name: scripts
          configMap:
            name: "migration-keycloak-script"
            items:
              - key: run.sh
                path: run.sh
            defaultMode: 0755
       {{- range $i, $t := .Values.tenants }}
        - name: tenant-{{ $t.name }}
          secret:
            secretName: {{ $t.name }}-tenant-secret
            defaultMode: 0444
        {{- end }}