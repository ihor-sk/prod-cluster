apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-management-secret
  namespace: eweb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: user-management-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"   
data:
  - secretKey: userManagementUser
    remoteRef:
      key: prod/eweb/admin
      property: userManagementUser
  - secretKey: userManagementPassword
    remoteRef:
      key: prod/eweb/admin
      property: userManagementPassword