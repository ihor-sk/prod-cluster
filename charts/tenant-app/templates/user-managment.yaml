apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-management-secret
  namespace: eweb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: user-management-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        username:  {{ printf "{{ .username }}" | quote }}
        password:  {{ printf "{{ .password }}" | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: prod/eweb/admin
        property: userManagementUser
    - secretKey: password
      remoteRef:
        key: prod/eweb/admin
        property: userManagementPassword
