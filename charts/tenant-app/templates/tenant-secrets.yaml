{{- $ns := .Values.global.namespace | default "eweb" -}}
{{- $keys := .Values.global.tenantKeys | default (list) -}}
{{- range $i, $t := .Values.tenants }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $t.name }}-tenant-secret
  namespace: eweb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: {{ $t.name }}-tenant-secret
    template:
      metadata:
        labels:
          acme.com/tenant-secret: "true"
      creationPolicy: Owner
      type: Opaque
      data:
{{- range $keys }}
        {{ . }}: {{ printf "{{ .%s }}" . | quote }}
{{- end }}
  data:
{{- range $keys }}
    - secretKey: {{ . }}
      remoteRef:
        key: prod/tenants/{{ $t.name }}/user
        property: {{ . }}
{{- end }}
---
{{ end }}